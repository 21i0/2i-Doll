[[mods]]
modId="two_i_combat_doll"
version="1.21.1-1.3.4"
displayName="2i Doll"
authors="2i学习"
description='''独立的战斗玩偶模组。完整内置当前 1.21.1 玩偶的源码和资源，保留原注册身份、专属皮肤和动画；无需额外安装单独玩偶模组。2i、龙幻与萧萧各有独立演出；龙幻可与活塞进行真实回合对战。可选联动万象担架和无用之物。'''

[[dependencies.two_i_combat_doll]]
modId="neoforge"
type="required"
versionRange="[21.1.249,)"
ordering="NONE"
side="BOTH"

[[dependencies.two_i_combat_doll]]
modId="minecraft"
type="required"
versionRange="[1.21.1]"
ordering="NONE"
side="BOTH"

[[dependencies.two_i_combat_doll]]
modId="useless_stretcher"
type="optional"
versionRange="[1.21.1-1.6.2,1.21.1-1.7.0)"
ordering="AFTER"
side="BOTH"

[[mixins]]
config="two_i_combat_doll.mixins.json"

